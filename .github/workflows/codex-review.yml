name: Request Codex review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  request-review:
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-codex-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target exposes repository secrets. Do not check out or execute PR code here.
      - name: Request review as the linked GitHub user
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::CODEX_REVIEW_TOKEN is not configured"
            exit 1
          fi

          gh api --silent \
            --method POST \
            "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --field body='@codex review'
