name: checks

# Model-free checks of the repository's agreed rules. No secrets; model runs
# stay local (docs/decisions/0006-keep-model-evaluations-local.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-clients
      - run: python3 scripts/check_plugins.py

  # The base and changed paths that the rule checks below compare against.
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.diff.outputs.base }}
      markdown: ${{ steps.diff.outputs.markdown }}
      plugins: ${{ steps.diff.outputs.plugins }}
      writing: ${{ steps.diff.outputs.writing }}
      git: ${{ steps.diff.outputs.git }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$(git merge-base "origin/$BASE_REF" HEAD)" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          # A new branch or a manual run has no base; the rule checks skip.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only --diff-filter=ACMR "$base" HEAD)"
          has() { grep -q "$1" <<< "$changed" && echo true || echo false; }
          {
            echo "base=$base"
            echo "markdown=$(has '\.md$')"
            echo "plugins=$(git diff --name-only "$base" HEAD | grep -q '^plugins/' && echo true || echo false)"
            echo "writing=$(has '^plugins/writing-workflow/')"
            echo "git=$(has '^plugins/git-workflow/')"
          } >> "$GITHUB_OUTPUT"

  markdown:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The same pinned command as the README's documentation procedure.
      - env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE" HEAD -- '*.md' |
            xargs -0 npx --yes markdownlint-cli@0.49.1

  versions:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ needs.changes.outputs.base }}
        run: python3 scripts/check_version_bumps.py "$BASE"

  writing-workflow-tests:
    needs: changes
    if: needs.changes.outputs.writing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv run --with 'sudachipy>=0.6.8' --with 'sudachidict-core>=20240409' \
            python -B -m unittest discover -s plugins/writing-workflow/tests -v

  git-workflow-tests:
    needs: changes
    if: needs.changes.outputs.git == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: |
          node --test plugins/git-workflow/tests/commitlint.test.mjs \
            plugins/git-workflow/tests/branch-validation.test.mjs
