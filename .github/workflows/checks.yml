name: checks

# Model-free checks of the repository's agreed rules. No secrets; model runs
# stay local (docs/decisions/0006-keep-model-evaluations-local.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; push runs each check their own
# range, so they are never cancelled.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-clients
      - run: python3 scripts/check_plugins.py

  # Base revision and changed areas for the rule checks; manual runs have none.
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.diff.outputs.base }}
      markdown: ${{ steps.diff.outputs.markdown }}
      plugins: ${{ steps.diff.outputs.plugins }}
      writing: ${{ steps.diff.outputs.writing }}
      git: ${{ steps.diff.outputs.git }}
      scripts: ${{ steps.diff.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE:-none}^{commit}" 2>/dev/null; then
            echo "::warning::No base commit; the rule checks are skipped."; exit 0
          fi
          base="$(git merge-base "$BASE" HEAD)"
          files="$(git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD)"
          { echo "base=$base"
            echo "markdown=$(grep -qE '\.md$' <<< "$files" && echo true)"
            echo "plugins=$(grep -q '^plugins/' <<< "$files" && echo true)"
            echo "writing=$(grep -q '^plugins/writing-workflow/' <<< "$files" && echo true)"
            echo "git=$(grep -q '^plugins/git-workflow/' <<< "$files" && echo true)"
            echo "scripts=$(grep -qE '^(plugins|scripts)/' <<< "$files" && echo true)"; } >> "$GITHUB_OUTPUT"

  markdown:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      # The README's pinned command, on added or modified Markdown only.
      - env:
          BASE: ${{ needs.changes.outputs.base }}
        run: git diff -z --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.md' | xargs -0 -r npx --yes markdownlint-cli@0.49.1 --

  versions:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ needs.changes.outputs.base }}
        run: python3 scripts/check_version_bumps.py "$BASE"

  writing-workflow-tests:
    needs: changes
    if: needs.changes.outputs.writing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --with 'sudachipy>=0.6.8' --with 'sudachidict-core>=20240409' python -B -m unittest discover -s plugins/writing-workflow/tests -v

  git-workflow-tests:
    needs: changes
    if: needs.changes.outputs.git == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: node --test plugins/git-workflow/tests/commitlint.test.mjs plugins/git-workflow/tests/branch-validation.test.mjs

  script-tests:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -B -m unittest discover -s scripts/tests -v
