name: pr-title

# The PR title becomes the squash commit subject, so it follows the
# writing-commits defaults; this repository has no commitlint configuration.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --yes --package @commitlint/cli@21.2.4 commitlint --strict --config plugins/git-workflow/skills/writing-commits/assets/commitlint.config.mjs
