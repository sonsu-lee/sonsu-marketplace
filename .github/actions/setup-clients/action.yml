name: setup-clients
description: Install Python, uv, Node.js 24, Bun, and the locked omp, Codex, and Claude Code CLIs.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        check-latest: true
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.4"
    # Versions are the checked baselines in README.md; bun.lock pins every
    # dependency by integrity hash, and Bun skips dependency install scripts.
    - shell: bash
      run: |
        bun install --frozen-lockfile --cwd "$GITHUB_ACTION_PATH/../../ci-clients"
        echo "$(cd "$GITHUB_ACTION_PATH/../../ci-clients" && pwd)/node_modules/.bin" >> "$GITHUB_PATH"
