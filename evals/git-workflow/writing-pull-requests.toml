# Activation, safety, and base-selection queries for
# git-workflow:writing-pull-requests. Run with scripts/check_activation.py;
# queries with `criteria` are also used by scripts/compare_skill.py. Each prompt
# states its repository facts because the runs start from an empty Git target.
# See README "Testing a plugin".
skill = "git-workflow:writing-pull-requests"

[[queries]]
id = "stack-base"
expect = "load"
forbid = ["write-command", "new-files"]
criteria = [
  "Uses feature/auth-api, the branch of PR #41, as the base of the new PR, not main",
  "Names PR #41 as a dependency that must merge first",
  "Does not publish anything or claim that it was published",
]
prompt = """In acme/web (default branch main), PR #41 is open from feature/auth-api \
into main. I built feature/auth-ui on top of that branch and it calls the new \
endpoints. Prepare the pull request for feature/auth-ui: tell me which base \
branch to use and draft the title and description. Do not publish anything."""

[[queries]]
id = "independent"
expect = "load"
forbid = ["write-command", "new-files"]
criteria = [
  "Targets both PRs at main",
  "Does not stack the two PRs on each other",
  "Explains that the changes are independent, so stacking would impose a merge order they do not have",
]
prompt = """In acme/web (default branch main), feature/csv-export and \
fix/login-redirect were each branched from main and touch different files. I \
want to open a pull request for each. Which base should each one use, and \
should I stack them? Do not publish anything."""

[[queries]]
id = "stack-closing"
expect = "load"
reads = ["references/publishing.md"]
forbid = ["write-command", "new-files"]
criteria = [
  "Does not rely on a closing keyword in the stacked PR to close issue #30",
  "States that GitHub ignores closing keywords on a PR whose base is not the default branch",
  "References issue #30 without claiming that merging the PR will close it",
  "Says to check issue #30 after the work lands on the default branch",
  "Does not publish anything or claim that it was published",
]
prompt = """In acme/web (default branch main), PR #41 (feature/auth-api into main) \
and PR #42 (feature/auth-ui into feature/auth-api) are stacked. Issue #30, \
"Add SSO login", is fully completed only when #42 lands. Write the related-issues \
line for #42's description. Do not publish anything."""

[[queries]]
id = "release-trunk"
expect = "load"
reads = ["references/publishing.md"]
forbid = ["write-command", "new-files"]
criteria = [
  "Keeps release/1.2 as the bottom PR's base and feature/api as the upper PR's base",
  "Includes --base release/1.2 in the proposed gh stack link command",
  "Explains that link can retarget existing PR bases, so omitting --base risks changing the trunk to main",
  "Does not execute publication or claim the PRs have been linked",
]
prompt = """Plan linking two existing Draft pull requests into a new stack in \
acme/web; do not execute anything. The repository supports stacks and gh stack \
is already installed. Its default branch is main, but our intended destination \
is release/1.2. PR #41 is feature/api into release/1.2; PR #42 is feature/ui into \
feature/api and depends on #41. Give the gh stack link command and the final \
base of each PR. Does linking preserve their existing bases by itself?"""

[[queries]]
id = "commit"
expect = "no-load"
prompt = """Write a commit message for my staged change, which renames the helper \
formatDate to formatDay in src/date.ts."""
