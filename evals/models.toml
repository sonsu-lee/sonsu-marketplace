# Model and reasoning effort that each client runs for model checks.
# `floor` is the weakest model the skills are meant to support; a cheap run on
# it exposes missing guidance. `default` is the model most users run and is the
# required check before merging. A result holds only for the profile it ran.

[floor]
omp = { model = "anthropic/claude-haiku-5-5", effort = "medium" }
claude = { model = "claude-haiku-5-5", effort = "medium" }
codex = { model = "gpt-6-luna", effort = "medium" }

[default]
omp = { model = "anthropic/claude-opus-5-5", effort = "high" }
claude = { model = "claude-opus-5-5", effort = "high" }
codex = { model = "gpt-6-astra", effort = "high" }
