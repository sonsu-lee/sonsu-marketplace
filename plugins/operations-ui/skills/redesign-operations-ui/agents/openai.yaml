interface:
  display_name: "Redesign Operations UI"
  short_description: "기존 운영 화면의 동작을 보존하며 제안·Figma·구현 등 요청한 산출물로 재설계합니다"
  default_prompt: "$redesign-operations-ui를 사용해 현재 기능·상태·권한을 확인한 뒤 이 운영 화면을 재설계하고, 요청한 제안·Figma·구현 산출물에 맞춰 검증해 줘. 운영형 웹 구현을 요청한 경우에는 실제 브라우저에서 회귀를 검증해 줘."
policy:
  allow_implicit_invocation: true
