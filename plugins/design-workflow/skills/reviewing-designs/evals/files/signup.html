<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create account</title>
  <style>
    form { max-width: 360px; margin: 48px auto; font-family: sans-serif; }
    input { display: block; width: 100%; margin: 8px 0; padding: 10px; border: 1px solid #ddd; }
    input::placeholder { color: #bbb; }
    .error { color: #e66; font-size: 11px; }
    button { width: 100%; padding: 12px; background: #9ab; color: #fff; border: 0; }
  </style>
</head>
<body>
  <form>
    <h1>Create account</h1>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <p class="error">Invalid input</p>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
