<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Members</title>
  <style>
    .card { width: 320px; font-family: sans-serif; border: 1px solid #ddd; }
    .row { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #ccd; }
    .name { white-space: nowrap; font-weight: 600; }
    .email { white-space: nowrap; color: #666; font-size: 13px; }
    .role { margin-left: auto; font-size: 12px; }
  </style>
</head>
<body>
  <section class="card">
    <h2>Members (3)</h2>
    <div class="row"><div class="avatar"></div><span class="name">Ann Lee</span><span class="email">ann@example.com</span><span class="role">Admin</span></div>
    <div class="row"><div class="avatar"></div><span class="name">Tom Park</span><span class="email">tom@example.com</span><span class="role">Editor</span></div>
    <div class="row"><div class="avatar"></div><span class="name">Mia Chen</span><span class="email">mia@example.com</span><span class="role">Viewer</span></div>
  </section>
</body>
</html>
