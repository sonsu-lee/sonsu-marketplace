  default_prompt: "$research를 사용해 단일 공개 검색부터 필요한 결과와 실제 Exa·Perplexity 기능으로 경로를 고르고, lookup·standard·deep 깊이에 맞는 원문 확인, 필요한 교차 검증·반증 탐색과 인용 감사를 거쳐 근거 중심의 최종본을 작성해 줘."
policy:
  allow_implicit_invocation: true
